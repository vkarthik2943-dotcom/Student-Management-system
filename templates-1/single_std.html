<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ std[1] }} | Student Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d17;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.10);
            --text: #eef0ff;
            --muted: #9aa0c3;
            --accent: #7c5cff;
            --accent-2: #00d4ff;
            --shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 10% -10%, rgba(124, 92, 255, 0.25), transparent 60%),
                radial-gradient(800px 500px at 100% 0%, rgba(0, 212, 255, 0.18), transparent 60%),
                var(--bg);
            background-attachment: fixed;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 48px 24px 80px; }

        /* Detail card */
        .detail {
            max-width: 760px; margin: 0 auto; overflow: hidden;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 28px; box-shadow: var(--shadow);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .detail-hero { position: relative; height: 280px; background: linear-gradient(135deg, #1b1f3a, #2a1f4d); }
        .detail-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .detail-hero::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(11, 13, 23, 0.95), transparent 70%);
        }
        .detail-hero .badge { position: absolute; top: 18px; right: 18px; z-index: 2; }

        .detail-body { padding: 32px; margin-top: -70px; position: relative; z-index: 2; }
        .detail-body h2 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 20px; }

        .meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 28px; }
        .meta div { background: rgba(255, 255, 255, 0.04); border-radius: 10px; padding: 14px 16px; }
        .meta span { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
        .meta strong { font-size: 1.1rem; font-weight: 600; }

        /* Badges */
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
            backdrop-filter: blur(8px);
        }
        .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .badge-present { color: #4ade80; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); }
        .badge-absent  { color: #f87171; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 22px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text);
            font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .btn:hover { transform: translateY(-2px); background: var(--surface-hover); }
        .btn-primary {
            border: none; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 30px -10px rgba(124, 92, 255, 0.8);
        }
        .btn-primary:hover {
            box-shadow: 0 14px 36px -8px rgba(0, 212, 255, 0.6);
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        @media (max-width: 600px) {
            .meta { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="detail">
            <div class="detail-hero">
                <img src="{{ std[6] }}" alt="{{ std[1] }}">
                {% if std[7] %}
                <span class="badge badge-present">Present</span>
                {% else %}
                <span class="badge badge-absent">Absent</span>
                {% endif %}
            </div>

            <div class="detail-body">
                <h2>{{ std[1] }}</h2>

                <div class="meta">
                    <div><span>Age</span><strong>{{ std[2] }}</strong></div>
                    <div><span>Gender</span><strong>{{ std[3] }}</strong></div>
                    <div><span>Marks</span><strong>{{ std[4] }}</strong></div>
                    <div><span>Course</span><strong>{{ std[5] }}</strong></div>
                </div>

                <a href="/" class="btn btn-primary">&larr; Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
