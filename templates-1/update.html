<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d17;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.10);
            --text: #eef0ff;
            --muted: #9aa0c3;
            --accent: #7c5cff;
            --accent-2: #00d4ff;
            --shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 10% -10%, rgba(124, 92, 255, 0.25), transparent 60%),
                radial-gradient(800px 500px at 100% 0%, rgba(0, 212, 255, 0.18), transparent 60%),
                var(--bg);
            background-attachment: fixed;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 48px 24px 80px; }
        .form-wrap { max-width: 640px; margin: 0 auto; }

        /* Header */
        .topbar { margin-bottom: 32px; }
        .title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800; letter-spacing: -0.03em;
            background: linear-gradient(90deg, #fff, var(--accent-2) 60%, var(--accent));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }

        /* Form panel */
        .panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 24px; padding: 36px;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field.full { grid-column: 1 / -1; }
        .field label {
            font-size: 0.8rem; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: .06em;
        }

        input[type="text"], input[type="number"], select {
            width: 100%; padding: 13px 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
            color: var(--text); font: inherit; font-size: 0.95rem; outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }
        input:focus, select:focus {
            border-color: var(--accent); background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.2);
        }
        select option { background: #161a2e; color: var(--text); }

        .form-actions { display: flex; gap: 12px; margin-top: 28px; align-items: center; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 22px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text);
            font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .btn:hover { transform: translateY(-2px); background: var(--surface-hover); }
        .btn-primary {
            border: none; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 30px -10px rgba(124, 92, 255, 0.8);
        }
        .btn-primary:hover {
            box-shadow: 0 14px 36px -8px rgba(0, 212, 255, 0.6);
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .panel { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-wrap">
            <div class="topbar">
                <h1 class="title">Update Student</h1>
                <p class="subtitle">Editing {{ std[1] }}</p>
            </div>

            <form class="panel" action="/students/edit/{{ std[0] }}" method="post">
                <div class="form-grid">
                    <div class="field full">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" value="{{ std[1] }}">
                    </div>
                    <div class="field">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" value="{{ std[2] }}">
                    </div>
                    <div class="field">
                        <label for="gender">Gender</label>
                        <input type="text" id="gender" name="gender" value="{{ std[3] }}">
                    </div>
                    <div class="field">
                        <label for="marks">Marks</label>
                        <input type="number" id="marks" name="marks" value="{{ std[4] }}">
                    </div>
                    <div class="field">
                        <label for="course">Course</label>
                        <input type="text" id="course" name="course" value="{{ std[5] }}">
                    </div>
                    <div class="field full">
                        <label for="image">Image URL</label>
                        <input type="text" id="image" name="image" value="{{ std[6] }}">
                    </div>
                    <div class="field full">
                        <label for="status">Attendance</label>
                        <select name="status" id="status">
                            <option value="1" {% if std[7] %}selected{% endif %}>Present</option>
                            <option value="0" {% if not std[7] %}selected{% endif %}>Absent</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Update Student</button>
                    <a href="/" class="btn back-link">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
